<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JARVIS">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%233b82f6'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='45'%3E⚡%3C/text%3E%3C/svg%3E">
    <title>Tony Stark AI - J.A.R.V.I.S.</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a2e;
            --border: #2a2a3e;
            --text: #e0e0e0;
            --text2: #8888aa;
            --accent: #3b82f6;
            --accent-glow: #3b82f640;
            --jarvis: #3b82f6;
            --friday: #22c55e;
            --clara: #a855f7;
            --error: #ef4444;
            --radius: 14px;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .header .logo {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--jarvis), #1d4ed8);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 16px var(--accent-glow);
            flex-shrink: 0;
        }
        .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
        .header .badge {
            font-size: 10px; background: var(--surface2);
            padding: 3px 8px; border-radius: 12px;
            color: var(--text2); border: 1px solid var(--border);
        }
        .status-dot {
            margin-left: auto; width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; box-shadow: 0 0 8px #22c55e80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .agent-bar {
            display: flex; gap: 6px; padding: 10px 16px;
            background: var(--surface); border-bottom: 1px solid var(--border);
            flex-shrink: 0; overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .agent-bar::-webkit-scrollbar { display: none; }
        .agent-btn {
            padding: 7px 14px; border-radius: 18px;
            border: 1px solid var(--border); background: var(--surface2);
            color: var(--text2); cursor: pointer;
            font-size: 12px; font-weight: 500;
            transition: all var(--transition); white-space: nowrap;
            display: flex; align-items: center; gap: 5px;
            user-select: none; -webkit-user-select: none;
        }
        .agent-btn:active { transform: scale(0.96); }
        .agent-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .agent-btn .dot { width: 7px; height: 7px; border-radius: 50%; }
        .dot.jarvis { background: var(--jarvis); box-shadow: 0 0 6px var(--jarvis); }
        .dot.friday { background: var(--friday); box-shadow: 0 0 6px var(--friday); }
        .dot.clara { background: var(--clara); box-shadow: 0 0 6px var(--clara); }
        .dot.auto { background: #666; }
        .chat {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .chat::-webkit-scrollbar { width: 4px; }
        .chat::-webkit-scrollbar-track { background: transparent; }
        .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .msg {
            display: flex; gap: 8px; max-width: 88%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.agent { align-self: flex-start; }
        .msg.error { align-self: center; }
        .msg .avatar {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; flex-shrink: 0;
        }
        .msg.user .avatar { background: #374151; }
        .msg.agent .avatar.jarvis { background: var(--jarvis); box-shadow: 0 0 10px var(--accent-glow); }
        .msg.agent .avatar.friday { background: var(--friday); box-shadow: 0 0 10px #22c55e80; }
        .msg.agent .avatar.clara { background: var(--clara); box-shadow: 0 0 10px #a855f780; }
        .msg .bubble {
            padding: 10px 14px; border-radius: var(--radius);
            font-size: 14px; line-height: 1.55; word-break: break-word;
        }
        .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
        .msg.agent .bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg.error .bubble { background: #7f1d1d20; border: 1px solid #7f1d1d; color: #fca5a5; font-size: 12px; }
        .msg .agent-label {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 3px;
        }
        .agent-label.jarvis { color: var(--jarvis); }
        .agent-label.friday { color: var(--friday); }
        .agent-label.clara { color: var(--clara); }
        .typing-indicator { display: flex; gap: 3px; padding: 6px 0; }
        .typing-indicator span {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--text2);
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.5); } 40% { transform: scale(1); } }
        .input-area {
            padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--surface); border-top: 1px solid var(--border);
            display: flex; gap: 8px; flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 10px 14px; border-radius: 22px;
            border: 1px solid var(--border); background: var(--surface2);
            color: var(--text); font-size: 14px; outline: none;
            transition: border var(--transition);
        }
        .input-area input:focus { border-color: var(--accent); }
        .input-area input::placeholder { color: var(--text2); }
        .input-area button {
            width: 40px; height: 40px; border-radius: 50%;
            border: none; background: var(--accent); color: #fff;
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all var(--transition); flex-shrink: 0;
        }
        .input-area button:active { transform: scale(0.92); }
        .input-area button:disabled { opacity: 0.4; }
        .footer {
            text-align: center; padding: 6px;
            font-size: 10px; color: var(--text2); flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">⚡</div>
    <h1>Tony Stark AI</h1>
    <span class="badge">J.A.R.V.I.S.</span>
    <span class="status-dot" id="statusDot" title="Connected"></span>
</div>

<div class="agent-bar" id="agentBar">
    <button class="agent-btn active" data-agent="">
        <span class="dot auto"></span> Auto
    </button>
    <button class="agent-btn" data-agent="jarvis">
        <span class="dot jarvis"></span> JARVIS
    </button>
    <button class="agent-btn" data-agent="friday">
        <span class="dot friday"></span> FRIDAY
    </button>
    <button class="agent-btn" data-agent="clara">
        <span class="dot clara"></span> CLARA
    </button>
</div>

<div class="chat" id="chat">
    <div class="msg agent">
        <div class="avatar jarvis">🔵</div>
        <div class="bubble">
            <div class="agent-label jarvis">J.A.R.V.I.S.</div>
            At your service, sir. How may I assist you today?
        </div>
    </div>
</div>

<div class="input-area">
    <input type="text" id="messageInput" placeholder="Type your message..." enterkeyhint="send">
    <button id="sendBtn" aria-label="Send">➤</button>
</div>
<div class="footer">Tony Stark AI Network • v1.0</div>

<script>
    // ===== PRODUCTION WEBHOOK — LIVE 24/7 =====
    const WEBHOOK_URL = 'https://webhook.latenode.com/102057/prod/f0edc6dd-3405-4a09-b990-45bb5bf4a8c9';

    let selectedAgent = '';
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');

    document.getElementById('agentBar').addEventListener('click', (e) => {
        const btn = e.target.closest('.agent-btn');
        if (!btn) return;
        document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAgent = btn.dataset.agent;
    });

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function addMessage(role, text, agentName) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        if (role === 'user') {
            div.innerHTML = `<div class="avatar">👤</div><div class="bubble">${escapeHtml(text)}</div>`;
        } else if (role === 'error') {
            div.innerHTML = `<div class="bubble">⚠️ ${escapeHtml(text)}</div>`;
        } else {
            const agentClass = agentName || 'jarvis';
            const agentLabel = (agentName || 'JARVIS').toUpperCase();
            const emoji = agentName === 'friday' ? '🟢' : agentName === 'clara' ? '🟣' : '🔵';
            div.innerHTML = `
                <div class="avatar ${agentClass}">${emoji}</div>
                <div class="bubble">
                    <div class="agent-label ${agentClass}">${agentLabel}</div>
                    ${escapeHtml(text)}
                </div>`;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function addTyping() {
        const div = document.createElement('div');
        div.className = 'msg agent';
        div.id = 'typingMsg';
        div.innerHTML = `<div class="avatar jarvis">🔵</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingMsg');
        if (el) el.remove();
    }

    function setStatus(ok) {
        statusDot.style.background = ok ? '#22c55e' : '#ef4444';
        statusDot.style.boxShadow = ok ? '0 0 8px #22c55e80' : '0 0 8px #ef444480';
        statusDot.title = ok ? 'Connected' : 'Disconnected';
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        input.disabled = true;
        sendBtn.disabled = true;
        addMessage('user', message);
        input.value = '';
        addTyping();
        setStatus(false);

        try {
            const body = { message };
            if (selectedAgent) body.agent = selectedAgent;

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 120000);

            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: controller.signal
            });
            clearTimeout(timeout);
            removeTyping();
            setStatus(true);

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();

            if (data.error) {
                addMessage('error', data.error);
            } else {
                const agentName = data.agent || 'jarvis';
                const responseText = typeof data.response === 'string'
                    ? data.response
                    : JSON.stringify(data.response, null, 2);
                addMessage('agent', responseText || '(No response received)', agentName);
            }
        } catch (err) {
            removeTyping();
            setStatus(false);
            if (err.name === 'AbortError') {
                addMessage('error', 'Request timed out. Please try a shorter message.');
            } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                addMessage('error', 'Cannot reach server. Ensure the scenario is deployed in Latenode.');
            } else {
                addMessage('error', `Error: ${err.message}`);
            }
        }

        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
</body>
</html>
